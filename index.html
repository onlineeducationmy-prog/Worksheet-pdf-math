<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Matematik Pro A4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5f9;
        }
        .math-mono {
            font-family: 'Courier Prime', monospace;
        }
        @media print {
            body {
                background: white !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 5mm !important;
                width: 100% !important;
                max-width: none !important;
                min-height: auto !important;
            }
            @page {
                size: A4 portrait;
                margin: 5mm;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header Panel (Hidden on Print) -->
    <header class="no-print bg-indigo-600 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-600 p-2.5 rounded-xl font-bold text-xl shadow">📐</div>
                <div>
                    <h1 class="text-xl font-bold">Bijak Matematik A4 Pro</h1>
                    <p class="text-xs text-indigo-200">Cetak soalan tanpa had sejajar sempurna untuk murid</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="generateQuestions()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition flex items-center gap-2">
                    🔄 Soalan Baru
                </button>
                <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition flex items-center gap-2">
                    🖨️ Cetak A4
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Controls Sidebar (Hidden on Print) -->
        <aside class="no-print lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5 h-fit">
            <h2 class="font-bold text-slate-700 text-base border-b pb-2">⚙️ Tetapan Soalan</h2>

            <!-- Operasi -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Pilih Operasi</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setOperation('+')" id="op-add" class="op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-indigo-50 border-indigo-500 text-indigo-700 font-semibold">➕ Tambah</button>
                    <button type="button" onclick="setOperation('-')" id="op-sub" class="op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-white border-slate-200 text-slate-700">➖ Tolak</button>
                    <button type="button" onclick="setOperation('×')" id="op-mul" class="op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-white border-slate-200 text-slate-700">✖️ Darab</button>
                    <button type="button" onclick="setOperation('÷')" id="op-div" class="op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-white border-slate-200 text-slate-700">➗ Bahagi</button>
                </div>
            </div>

            <!-- Tahap Digit -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Tahap & Format Digit</label>
                <div class="space-y-2">
                    <button type="button" onclick="setDifficulty('single-single')" id="diff-single-single" class="diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-slate-50 border-indigo-500 text-indigo-900 font-semibold">
                        Single & Single Digit (cth: 5 + 4)
                    </button>
                    <button type="button" onclick="setDifficulty('double-single')" id="diff-double-single" class="diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700">
                        Double & Single Digit (cth: 48 + 7)
                    </button>
                    <button type="button" onclick="setDifficulty('double-double')" id="diff-double-double" class="diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700">
                        Double & Double Digit (cth: 54 + 23)
                    </button>
                    <button type="button" onclick="setDifficulty('triple-double')" id="diff-triple-double" class="diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700">
                        Triple & Double Digit (cth: 342 + 56)
                    </button>
                </div>
            </div>

            <!-- Susunan -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Susunan Soalan</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setLayout('vertical')" id="layout-vertical" class="layout-btn py-2 px-3 rounded-lg border text-xs font-medium transition bg-indigo-50 border-indigo-500 text-indigo-700 font-semibold">↕️ Menegak</button>
                    <button type="button" onclick="setLayout('horizontal')" id="layout-horizontal" class="layout-btn py-2 px-3 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700">↔️ Melintang</button>
                </div>
            </div>

            <!-- Jumlah Soalan -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Jumlah Soalan Semuka Surat</label>
                <select id="question-count" onchange="generateQuestions()" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500">
                    <option value="20" selected>20 Soalan (Penuh 1 Muka A4)</option>
                    <option value="16">16 Soalan</option>
                    <option value="12">12 Soalan</option>
                    <option value="8">8 Soalan</option>
                </select>
            </div>

            <div class="pt-2">
                <button onclick="toggleAnswerKey()" id="toggle-ans-btn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg text-xs transition">
                    👁️ Papar / Sembunyi Skema Jawapan
                </button>
            </div>
        </aside>

        <!-- Preview Area (A4 Sheet Simulation) -->
        <section class="lg:col-span-3 flex justify-center">
            <div class="print-container bg-white w-full max-w-[210mm] min-h-[297mm] p-6 md:p-8 shadow-lg rounded-2xl border border-slate-200 flex flex-col justify-between">
                
                <!-- Worksheet Header -->
                <div>
                    <div class="grid grid-cols-2 gap-4 border-b-2 border-slate-800 pb-3 mb-4">
                        <div>
                            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-1">NAMA / NAME:</span>
                            <div class="border-b border-slate-400 h-6"></div>
                        </div>
                        <div>
                            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-1">TARIKH / DATE:</span>
                            <div class="border-b border-slate-400 h-6"></div>
                        </div>
                    </div>

                    <!-- Title Banner -->
                    <div class="border-2 border-slate-800 rounded-xl p-3 mb-4 bg-slate-50 flex justify-between items-center">
                        <div>
                            <h2 id="sheet-title" class="font-extrabold text-sm md:text-base tracking-wide uppercase text-slate-900"></h2>
                            <p id="sheet-subtitle" class="text-xs text-slate-600 font-medium mt-0.5">Sila selesaikan semua soalan matematik di bawah dengan teliti.</p>
                        </div>
                        <div class="text-2xl">✏️</div>
                    </div>
                </div>

                <!-- Questions Grid Container -->
                <div id="questions-container" class="my-auto grid gap-3 py-2">
                    <!-- Soalan akan dijana melalui JavaScript -->
                </div>

                <!-- Footer Nota -->
                <div class="border-t border-slate-200 pt-2 mt-4 flex justify-between items-center text-[10px] text-slate-400">
                    <span></span>
                    <span class="font-semibold text-slate-600">🎓online.education1.my</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentOp = '+';
        let currentDiff = 'single-single';
        let currentLayout = 'vertical';
        let showAnswers = false;
        let generatedData = [];

        function setOperation(op) {
            currentOp = op;
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.className = "op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-white border-slate-200 text-slate-700";
            });
            const activeId = op === '+' ? 'op-add' : op === '-' ? 'op-sub' : op === '×' ? 'op-mul' : 'op-div';
            document.getElementById(activeId).className = "op-btn py-2 px-3 rounded-lg border text-sm font-medium transition bg-indigo-50 border-indigo-500 text-indigo-700 font-semibold";
            generateQuestions();
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.className = "diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700";
            });
            document.getElementById(`diff-${diff}`).className = "diff-btn w-full text-left px-3 py-2.5 rounded-lg border text-xs font-medium transition bg-slate-50 border-indigo-500 text-indigo-900 font-semibold";
            generateQuestions();
        }

        function setLayout(layout) {
            currentLayout = layout;
            document.querySelectorAll('.layout-btn').forEach(btn => {
                btn.className = "layout-btn py-2 px-3 rounded-lg border text-xs font-medium transition bg-white border-slate-200 text-slate-700";
            });
            document.getElementById(`layout-${layout}`).className = "layout-btn py-2 px-3 rounded-lg border text-xs font-medium transition bg-indigo-50 border-indigo-500 text-indigo-700 font-semibold";
            generateQuestions();
        }

        function toggleAnswerKey() {
            showAnswers = !showAnswers;
            const btn = document.getElementById('toggle-ans-btn');
            btn.innerText = showAnswers ? "🙈 Sembunyikan Skema Jawapan" : "👁️ Papar / Sembunyi Skema Jawapan";
            btn.className = showAnswers ? "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-xs transition" : "w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg text-xs transition";
            renderQuestions();
        }

        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateNumbers(diff, op) {
            let num1 = 0, num2 = 0;

            if (diff === 'single-single') {
                num1 = getRandomNumber(1, 9);
                num2 = getRandomNumber(1, 9);
            } else if (diff === 'double-single') {
                num1 = getRandomNumber(10, 98);
                num2 = getRandomNumber(1, 9);
            } else if (diff === 'double-double') {
                num1 = getRandomNumber(10, 89);
                num2 = getRandomNumber(10, 89);
            } else if (diff === 'triple-double') {
                num1 = getRandomNumber(100, 899);
                num2 = getRandomNumber(10, 89);
            }

            if (op === '-') {
                if (num1 < num2) {
                    let temp = num1; num1 = num2; num2 = temp;
                }
            } else if (op === '÷') {
                num2 = getRandomNumber(2, diff === 'single-single' ? 9 : 12);
                let multiplier = getRandomNumber(1, diff === 'single-single' ? 9 : (diff === 'double-double' ? 20 : 50));
                num1 = num2 * multiplier;
            }

            return { num1, num2 };
        }

        function generateQuestions() {
            const count = parseInt(document.getElementById('question-count').value);
            generatedData = [];

            let opName = currentOp === '+' ? 'TAMBAH (ADDITION)' : currentOp === '-' ? 'TOLAK (SUBTRACTION)' : currentOp === '×' ? 'DARAB (MULTIPLICATION)' : 'BAHAGI (DIVISION)';
            let diffName = currentDiff === 'single-single' ? 'SINGLE & SINGLE DIGIT' : currentDiff === 'double-single' ? 'DOUBLE & SINGLE DIGIT' : currentDiff === 'double-double' ? 'DOUBLE & DOUBLE DIGIT' : 'TRIPLE & DOUBLE DIGIT';
            
            document.getElementById('sheet-title').innerText = `${diffName} — ${opName}`;

            for (let i = 0; i < count; i++) {
                let { num1, num2 } = generateNumbers(currentDiff, currentOp);
                let ans = 0;
                if (currentOp === '+') ans = num1 + num2;
                if (currentOp === '-') ans = num1 - num2;
                if (currentOp === '×') ans = num1 * num2;
                if (currentOp === '÷') ans = num1 / num2;

                generatedData.push({ id: i + 1, num1, num2, ans });
            }

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const count = generatedData.length;
            let gridColsClass = count <= 12 ? 'grid-cols-3' : 'grid-cols-4';
            if (currentLayout === 'horizontal') {
                gridColsClass = count <= 12 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3';
            }
            container.className = `my-auto grid ${gridColsClass} gap-3 py-1`;

            generatedData.forEach((q) => {
                const itemBox = document.createElement('div');
                itemBox.className = "p-2.5 border border-slate-200 rounded-xl bg-white flex flex-col justify-center items-center shadow-2xs relative";

                if (currentLayout === 'vertical') {
                    if (currentOp === '÷') {
                        // Bentuk Lazim Bahagi yang betul tanpa kotak jawapan di bawah
                        itemBox.innerHTML = `
                            <div class="absolute top-1.5 left-2 text-[10px] font-semibold text-slate-400">(${q.id})</div>
                            <div class="math-mono text-base md:text-lg font-bold text-slate-900 my-4 flex items-center justify-center">
                                <span class="pr-1 tracking-wider">${q.num2}</span>
                                <div class="border-t-2 border-l-2 border-slate-900 pl-2 pt-0.5 tracking-widest">${q.num1}</div>
                            </div>
                            <div class="text-[10px] font-semibold text-indigo-700 h-4 flex items-center justify-center">
                                ${showAnswers ? 'Jawapan: ' + q.ans : ''}
                            </div>
                        `;
                    } else {
                        // Susunan Menegak Biasa untuk +, -, × tanpa kotak jawapan di bawah (ruang kosong di atas garis atau jawapan tersembunyi)
                        itemBox.innerHTML = `
                            <div class="absolute top-1.5 left-2 text-[10px] font-semibold text-slate-400">(${q.id})</div>
                            <div class="math-mono text-lg md:text-xl font-bold text-slate-900 my-1 flex flex-col items-end pr-3">
                                <div class="text-right tracking-[0.3em]">${q.num1}</div>
                                <div class="flex items-center justify-end w-full tracking-[0.3em]">
                                    <span class="text-indigo-600 font-extrabold text-base mr-1 tracking-normal">${currentOp}</span>
                                    <span>${q.num2}</span>
                                </div>
                                <div class="w-full border-t-2 border-slate-800 my-1"></div>
                            </div>
                            <div class="text-[10px] font-semibold text-indigo-700 h-5 flex items-center justify-center">
                                ${showAnswers ? q.ans : ''}
                            </div>
                        `;
                    }
                } else {
                    // Susunan Melintang
                    itemBox.innerHTML = `
                        <div class="absolute top-1 left-2 text-[10px] font-semibold text-slate-400">(${q.id})</div>
                        <div class="math-mono text-sm md:text-base font-bold text-slate-900 my-2 text-center">
                            ${q.num1} ${currentOp} ${q.num2} = 
                            <span class="inline-block border-b-2 border-slate-800 px-2 min-w-[45px] text-center text-indigo-700">${showAnswers ? q.ans : ''}</span>
                        </div>
                    `;
                }

                container.appendChild(itemBox);
            });
        }

        window.onload = function() {
            generateQuestions();
        };
    </script>
</body>
</html>
